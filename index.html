function syncSchoolMenus(p,target=state){if(!p.school)return;const menus={...target.menus};for(const [key,week] of Object.entries(menus))if(key.startsWith(p.id+'|')&&Array.isArray(week?.days))menus[key]={...week,days:week.days.map((day,n)=>{if(!isRecord(day))return day;const copy={...day};for(const slot of schoolMealsFor(p))if(schoolMealForDate(addDays(key.slice(p.id.length+1),n),slot,p,target))copy[slot]=emptyMeal();return copy;})};target.menus=menus;}
function saveSchoolControls(el){const form=el.closest('form'),toggle=form.querySelector('[name="school"]'),fieldset=form.querySelector('.school-days'),previous=state.profiles.find(x=>x.id===form.dataset.profileId);const mealBoxes=[...form.querySelectorAll('[name="schoolMeal"]')].filter(x=>SCHOOL_SLOTS.includes(x.value));let meals=mealBoxes.length?mealBoxes.filter(x=>x.checked).map(x=>x.value):schoolMealsFor(previous||{}),days=[...form.querySelectorAll('[name="schoolDay"]:checked')].map(x=>Number(x.value));if(toggle.checked&&!meals.length){if(el.name==='schoolMeal'){el.checked=true;notify('Conserva al menos una toma en el colegio.');return;}meals=['lunch'];for(const box of mealBoxes)box.checked=meals.includes(box.value);}if(toggle.checked&&!days.length){if(el.name==='schoolDay'){el.checked=true;notify('Conserva al menos un día de colegio.');return;}days=[0,1,2,3,4];for(const input of form.querySelectorAll('[name="schoolDay"]'))input.checked=days.includes(Number(input.value));}fieldset.hidden=!toggle.checked;if(!previous)return;const p={...previous,school:toggle.checked,schoolMeals:meals,schoolDays:days},next={...state,profiles:state.profiles.map(x=>x.id===p.id?p:x)};syncSchoolMenus(p,next);const saved=commitUserState(next);if(!saved){toggle.checked=previous.school;fieldset.hidden=!previous.school;for(const input of form.querySelectorAll('[name="schoolDay"]'))input.checked=(previous.schoolDays?.length?previous.schoolDays:[0,1,2,3,4]).includes(Number(input.value));for(const box of mealBoxes)box.checked=schoolMealsFor(previous).includes(box.value);}form.querySelector('#school-save-status').textContent=saved?'Guardado':'No se ha podido guardar';}
function schoolDay(day,p=profile()){return !!p.school&&(p.schoolDays?.length?p.schoolDays:[0,1,2,3,4]).includes(day);}
function schoolMealsFor(p=profile()){return Array.isArray(p.schoolMeals)?[...new Set(p.schoolMeals.filter(slot=>SCHOOL_SLOTS.includes(slot)))]:['lunch'];}
function schoolMeal(day,slot,p=profile()){return SCHOOL_SLOTS.includes(slot)&&schoolDay(day,p)&&schoolMealsFor(p).includes(slot);}
function schoolAria(day,slot='lunch'){return 'Registrar '+slotLabel(slot).toLocaleLowerCase('es')+' del colegio del '+DAYS[day];}
function schoolKey(day,slot='lunch'){return mealKey()+'|'+day+(slot==='lunch'?'':'|'+slot);}
function schoolText(day,slot='lunch'){return state.schoolLogs[schoolKey(day,slot)]||'';}
function mealData(day,slot){const original=menu().days[day][slot];const m=schoolMeal(day,slot)?{...original,external:true,recipeId:null,locked:false}:original;return {m,recipe:recipeById(m?.recipeId)};}
function renderSchool(){if(!profile().school)return '';return `<section class="surface panel-pad school-panel"><div class="subheading"><div><h2>Tomas en el colegio</h2><p>Anota lo que ha tomado al saberlo. Estas tomas no se generan ni se añaden a la compra.</p></div>${icon('edit')}</div><div class="school-list">${DAYS.map((day,i)=>SCHOOL_SLOTS.filter(slot=>schoolMeal(i,slot)).map(slot=>`<button class="school-entry" data-action="school-log" data-day="${i}" data-slot="${slot}" aria-label="${h(schoolAria(i,slot))}"><strong>${day} ${parseDate(addDays(state.week,i)).getDate()} · ${h(slotLabel(slot))}</strong><span>${h(schoolText(i,slot)||'Pendiente de anotar')}</span><small>${schoolText(i,slot)?'Editar':'Anotar'}</small></button>`).join('')).join('')}</div></section>`;}
function schoolModal(day,slot='lunch'){return `<form id="school-form" data-day="${day}" data-slot="${slot}" data-week-key="${h(mealKey())}"><div class="field"><label for="school-food">${slot==='lunch'?'¿Qué ha comido en el colegio?':'¿Qué ha tomado en '+h(slotLabel(slot).toLocaleLowerCase('es'))+' del colegio?'}</label><textarea id="school-food" name="food" maxlength="1500" rows="5" placeholder="Anota los alimentos y el plato">${h(state.schoolLogs[schoolKey(day,slot)]||'')}</textarea><small>Registro de esta toma. No cambia las demás comidas.</small></div><button class="btn primary" type="submit">${icon('check')}Guardar registro</button></form>`;}
function mealCard(day,slot,mobile=false){if(schoolMeal(day,slot))return `<button type="button" class="${mobile?'mobile-meal':'meal-cell'} school-placeholder" data-action="school-log" data-day="${day}" data-slot="${slot}" aria-label="${h(schoolAria(day,slot))}"><span class="school-placeholder-main"><strong>${icon('edit')}${h(slotLabel(slot))} · Colegio</strong><span>${schoolText(day,slot)?'Comida anotada · Ver / editar':'Pendiente de anotar'}</span></span></button>`;const {m,recipe}=mealData(day,slot);const title=m?.external?'Comida fuera / comedor':recipe?.name||'Sin definir';const detail=m?.external?'No se incluye en la compra':m?.locked?'Plato fijado':'';if(!mobile)return `<button type="button" class="meal-cell meal-${slot} ${m?.external?'external':''}" data-action="meal" data-day="${day}" data-slot="${slot}" aria-label="Editar ${h(slotLabel(slot))} del ${DAYS[day]}"><span class="meal-heading">${h(slotLabel(slot))}${icon(m?.locked?'lock':'edit')}</span><span class="meal-name">${h(title)}</span>${detail?`<span class="meal-detail">${h(detail)}</span>`:''}</button>`;
const slotIcons={breakfast:'coffee',midmorning:'apple',lunch:'utensils',snack:'bread',dinner:'moon'};
return `<button type="button" class="mobile-meal meal-${slot}" data-action="meal" data-day="${day}" data-slot="${slot}"><span class="meal-icon">${icon(slotIcons[slot])}</span><span class="mobile-meal-main"><span class="meal-heading">${h(slotLabel(slot))}${m.locked?' · FIJADO':''}</span><span class="meal-name">${h(title)}</span>${detail?`<span class="meal-detail">${h(detail)}</span>`:''}</span><span class="chev">${icon('chevronright')}</span></button>`;}
function renderWeek(){const today=iso(new Date());const selected=Math.max(0,Math.min(6,state.selectedDay));const date=addDays(state.week,selected);let grid=DAYS.map((name,day)=>`<div class="day-col ${addDays(state.week,day)===today?'today':''}"><div class="day-head"><span class="day-name">${name}</span><span class="day-num">${parseDate(addDays(state.week,day)).getDate()} <small>${MONTHS[parseDate(addDays(state.week,day)).getMonth()].slice(0,3)}</small></span></div>${activeMeals().map(([slot])=>mealCard(day,slot)).join('')}</div>`).join('');return `<section class="surface"><div class="section-top"><div><h2>Menú de la semana</h2><p>Haz clic en cualquier plato para editarlo o sustituirlo.</p></div><div class="toolbar">${weekControls()}<button class="btn outline" data-action="print-menu">${icon('printer')}<span>Imprimir / PDF</span></button><button type="button" class="btn outline" data-action="share-menu-pdf">${icon('share')}Compartir PDF</button><button class="btn primary" data-action="nav" data-view="generate">${icon('wand')}Nuevo menú</button></div></div><div class="week-grid-wrap"><div class="week-grid">${grid}</div></div><div class="mobile-week"><div class="mobile-day-selector">${DAYS.map((d,i)=>`<button class="day-pick ${selected===i?'active':''}" data-action="day" data-day="${i}" aria-label="Mostrar ${d}" aria-pressed="${selected===i}"><span>${d.slice(0,1)}</span><b>${parseDate(addDays(state.week,i)).getDate()}</b></button>`).join('')}</div><div style="padding:13px 17px 2px;color:var(--readable);font-size:0.7857rem;font-weight:700">${DAYS[selected]}, ${parseDate(date).getDate()} de ${MONTHS[parseDate(date).getMonth()]}</div>${activeMeals().map(([slot])=>mealCard(selected,slot,true)).join('')}<div style="height:14px"></div></div></section>${renderVariety()}${renderFamilySafety()}${renderSchool()}${summaryPanels()}`;}
function chartCounts(){const counts=Object.fromEntries(GROUPS.map(x=>[x[0],0]));let count=0;for(let day=0;day<7;day++)for(const [slot] of activeMeals()){const {m:meal}=mealData(day,slot);if(meal&&!meal.external){const r=recipeById(meal.recipeId);if(r){counts[r.group]=(counts[r.group]||0)+1;count++;}}}return {counts,count};}
function chartMarkup(){const {counts,count}=chartCounts();let offset=0;const circles=GROUPS.map(([k,,c])=>{const v=count?counts[k]/count:0;let x=`<circle cx="80" cy="80" r="55" fill="none" stroke="${c}" stroke-width="21" stroke-dasharray="${v*345.575} 345.575" stroke-dashoffset="${-offset*345.575}" />`;offset+=v;return x;}).join('');return `<div class="chart-layout"><svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Distribución de ${count} platos por categoría"><circle cx="80" cy="80" r="55" stroke="var(--line)" stroke-width="21" fill="none"/>${circles}<text x="80" y="75" text-anchor="middle" fill="var(--ink)" font-size="27" font-weight="780">${count}</text><text x="80" y="94" text-anchor="middle" fill="var(--muted)" font-size="11">platos</text></svg><div class="chart-legend">${GROUPS.map(([k,label,c])=>`<div class="legend-item"><i class="dot" style="background:${c}"></i><span>${label} · ${counts[k]||0}</span></div>`).join('')}</div></div>`;}
function shoppingData(){const map=new Map();let unspecified=0,externalCount=0;for(let day=0;day<7;day++)for(const [slot] of activeMeals()){const {m}=mealData(day,slot);if(m?.external){externalCount++;continue;}const r=recipeById(m?.recipeId);if(!r)continue;for(const ing of r.ingredients||[]){const displayName=ingredientProductName(ing)+(ing.foodState?' ('+ing.foodState+')':'');const key=displayName.trim().toLocaleLowerCase('es');if(!key)continue;let v=map.get(key);if(!v){v={name:displayName,group:ing.group||'otros',known:{},unknown:0};map.set(key,v);}if(Number.isFinite(ing.qty)&&ing.qty>0){v.known[ing.unit]=(v.known[ing.unit]||0)+ing.qty;}else{v.unknown++;unspecified++;}}}return {items:[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'es')),unspecified,externalCount};}

const VARIETY_GROUPS=[['fruta','fruta'],['verduras','verduras'],['cereales','cereales o tubérculos'],['legumbres','legumbres'],['pescado','pescado']];
let varietyChange=null;
function normalizedFood(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function ingredientCategory(item){const name=normalizedFood(item.name);if(/\b(merluza|salmon|sardinas?|atun|bacalao|caballa|trucha|dorada|lubina|pescado|lenguado|rape|boquerones?)\b/.test(name))return 'pescado';if(/\b(aceite|aguacate|cacahuete|almendra|nueces|agua|sal|especias|perejil|ajo|pimienta|oregano)\b/.test(name))return 'otros';if(/\b(garbanzos?|lentejas?|alubias?|judias blancas|judias rojas|guisantes?|soja|tofu)\b/.test(name))return 'legumbres';if(['fruta','verduras','cereales','legumbres','lacteos'].includes(item.group))return item.group;if(/\b(pollo|pavo|huevo|huevos|ternera|cerdo|conejo|vacuno)\b/.test(name))return 'proteinas';return null;}
function varietyReview(){const counts=Object.fromEntries(VARIETY_GROUPS.map(([k])=>[k,0]));let incomplete=false;const restricted=!!(profile().restrictions?.length||String(profile().excluded||'').trim());for(let day=0;day<7;day++)for(const [slot] of activeMeals()){const {m,recipe:r}=mealData(day,slot);if(m.external)continue;if(!r||!r.ingredients?.length){incomplete=true;continue;}const groups=new Set();for(const item of r.ingredients){const category=ingredientCategory(item);if(!category)incomplete=true;else groups.add(category);}for(const key of groups)if(key in counts)counts[key]++;}return {counts,incomplete,restricted,missing:VARIETY_GROUPS.filter(([k])=>!counts[k])};}
function rememberVarietyChange(before){const after=varietyReview();varietyChange={key:mealKey(),groups:VARIETY_GROUPS.filter(([k])=>before.counts[k]>0&&!after.counts[k]).map(([k])=>k)};}
function renderVariety(){const r=varietyReview(),school=profile().school,title=school?'Revisión del menú de casa':'Variedad de la semana';let body='',tone='neutral',symbol='info';if(r.restricted){body='<p>Revisión incompleta: el perfil tiene restricciones o alimentos excluidos. Revisa la variedad de forma individual.</p>';}else{if(r.missing.length){tone='warning';symbol='alert';body=r.missing.map(([key,label])=>{const removed=varietyChange?.key===mealKey()&&varietyChange.groups.includes(key);return `<p>${removed?'Has eliminado el último plato con '+label+' de esta semana.':'Aviso: no hay '+label+' en el menú de casa de esta semana.'}</p>`;}).join('');}else if(!r.incomplete){tone='success';symbol='smile';body='<p><strong>¡Buena variedad esta semana! Buena faena.</strong></p>';}if(r.incomplete)body+='<p>Revisión incompleta: hay tomas sin definir o ingredientes sin clasificar.</p>';}
return `<section class="variety-panel variety-${tone}" aria-labelledby="variety-title"><div class="variety-symbol">${icon(symbol)}</div><div><h2 id="variety-title">${title}</h2><div aria-live="polite">${body}</div>${tone==='success'?'':`<small>Comprueba presencia de grupos, no cantidades ni equilibrio nutricional.${school?' Las comidas del colegio quedan fuera de esta revisión.':''}</small>`}<button class="btn outline" data-action="review-menu">${icon('calendar')}Revisar platos</button></div></section>`;}
function categoryBars(){const {counts,count}=chartCounts();return `<div class="category-bars" aria-label="Porcentaje de platos por categoría"><p>Porcentaje de platos por categoría · no de nutrientes.</p>${GROUPS.map(([key,label,color])=>{const amount=counts[key]||0,percent=count?amount/count*100:0,display=percent>0&&percent<1?'<1':String(Math.round(percent));return `<div class="category-row ${amount?'':'category-zero'}"><div class="category-label"><span>${h(label)}</span><strong>${h(display)}%</strong></div><div class="category-track" role="meter" aria-label="${h(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent.toFixed(2)}" aria-valuetext="${h(display)}% · ${amount} platos"><span style="width:${percent}%;background:${color}"></span></div></div>`;}).join('')}${!count?'<small>No hay platos definidos para calcular porcentajes.</small>':''}</div>`;}
function summaryPanels(){const a=chartCounts(),b=shoppingData(),locked=menu().days.reduce((n,day,i)=>n+activeMeals().filter(([slot])=>mealData(i,slot).m.locked).length,0);return `<div class="summary-grid"><section class="surface summary-card"><div class="subheading"><div><h2>Tu semana de un vistazo</h2><p>Resumen de la planificación actual</p></div>${icon('calendar')}</div><div class="summary-mini"><div class="mini-box"><div class="mini-value">${a.count}</div><div class="mini-label">Tomas en casa</div></div><div class="mini-box"><div class="mini-value">${b.items.length}</div><div class="mini-label">Ingredientes diferentes</div></div><div class="mini-box"><div class="mini-value">${locked}</div><div class="mini-label">Platos fijados</div></div></div></section><section class="surface summary-card"><div class="subheading"><div><h2>Platos en casa</h2><p>Visualización provisional · no mide equilibrio nutricional</p></div>${icon('sparkles')}</div>${chartMarkup()}${categoryBars()}</section></div>`;}
function renderGenerate(){const blocked=familyBlock();return `<section class="surface panel-pad"><div class="subheading"><div><h2>Preparar la semana</h2><p>${h(profile().name)} · ${h(ageLabel(profile()))}</p></div>${icon('wand')}</div><div class="toolbar generate-actions"><button class="btn primary" data-action="generate-family" ${blocked?'disabled':''}>${icon('wand')}Generar Menú</button><button class="btn outline" data-action="blank-week">${icon('plus')}Empezar desde cero</button><button class="btn outline" data-action="nav" data-view="recipes">${icon('list')}Ver recetario</button></div>${blocked?`<p class="selected-surface">${h(blocked)}</p>`:'<p>La propuesta reparte familias de platos y evita repetir el mismo plato el mismo día. Conserva platos fijados y comidas externas.</p>'}${profile().school?'<p class="selected-surface">El colegio se anota aparte. La propuesta solo organiza las tomas de casa; no compensa ni evalúa la alimentación total del día.</p>':''}${renderAgeGuide()}<details class="family-recipe"><summary>Cómo se prepara la propuesta</summary><p>En una semana con 14 comidas y cenas en casa se intenta distribuir 4 platos principales de legumbres, 3 de pescado, 2 con huevo, 2 de ave, 1 de carne roja y 2 de base vegetal. Es una plantilla editorial de variedad, no una prescripción de raciones. Se ajusta al número de tomas de casa y a los platos fijados.</p><p>No determina cantidades ni evalúa nutrientes. Los desayunos, la media mañana y las meriendas son opciones configurables: no obligan a realizar todas las tomas.</p>${familyCriteria()}</details></section>`;}

function purchaseKey(item){return mealKey()+'|'+item.name.toLocaleLowerCase('es');}
function shoppingAmount(item){const entries=Object.entries(item.known);let a=entries.map(([unit,qty])=>fmtNum(qty)+' '+unit).join(' + ');if(item.unknown)a+=(a?' · ':'')+'cantidad sin especificar ('+item.unknown+')';return a||'Cantidad sin especificar';}
function renderShopping(){const data=shoppingData();const groups=new Map();for(const item of data.items){const k=(typeof shoppingGroup==='function'?shoppingGroup(item):(GROUPS.find(x=>x[0]===item.group)?.[1]||'Otros'));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(item);}const checked=data.items.filter(x=>state.purchased[purchaseKey(x)]).length;return `<div class="page-grid"><section class="surface panel-pad"><div class="subheading"><div><h2>Ingredientes de la semana</h2><p>${data.items.length} ingredientes · ${checked} marcados como comprados</p></div><div class="toolbar"><button class="btn outline" data-action="print-shopping">${icon('printer')}Imprimir / PDF</button><button type="button" class="btn outline" data-action="share-shopping-pdf">${icon('share')}Compartir PDF</button></div></div>${[...groups.entries()].map(([name,items])=>`<div class="group-heading"><span>${h(name)}</span><span>${items.length}</span></div>${items.map(item=>`<label class="shopping-row"><input type="checkbox" data-action="purchase" data-item="${h(item.name)}" ${state.purchased[purchaseKey(item)]?'checked':''}/><span class="shopping-name"><b style="${state.purchased[purchaseKey(item)]?'text-decoration:line-through;opacity:.65':''}">${h(item.name)}</b><small>${h(shoppingAmount(item))}</small></span>${icon('check')}</label>`).join('')}`).join('')}</section><aside class="surface panel-pad"><div class="subheading"><h2>Compra inteligente</h2>${icon('basket')}</div><div class="selected-surface"><strong>Cantidades de tu menú</strong>Añade cantidades a los platos para sumarlas aquí. Las comidas del colegio no se incluyen.</div><div class="divider"></div><div class="stat-block">${icon('list')}<span>${data.items.length} ingredientes diferentes</span></div><div class="stat-block">${icon('clock')}<span>${data.unspecified} cantidades pendientes de definir</span></div><div class="stat-block">${icon('utensils')}<span>${data.externalCount} comidas externas excluidas</span></div><div class="divider"></div><button class="btn soft-btn" data-action="uncheck-all" style="width:100%">Desmarcar lista</button></aside></div>`;}
function ageLabel(p){const years=Number(p.ageYears)||0,months=Number(p.ageMonths)||0;return `${years} ${years===1?'año':'años'}${months?' y '+months+' '+(months===1?'mes':'meses'):''}`;}
function renderProfiles(){const p=editingProfileId==='new'?null:(state.profiles.find(x=>x.id===(editingProfileId||state.activeProfile))||null);return `<div class="page-grid"><section class="surface panel-pad"><div class="subheading"><div><h2>Perfiles guardados en este dispositivo</h2><p>Crea tantos perfiles como necesites; cada uno mantiene su menú.</p></div><button class="btn primary" data-action="new-profile">${icon('plus')}Añadir</button></div>${state.profiles.map(x=>`<div class="profile-card ${x.id===state.activeProfile?'active-profile':''}"><div class="profile-info"><span class="avatar">${h(x.name.slice(0,1).toUpperCase())}</span><div><b>${h(x.name)}</b><small>${h(ageLabel(x))}${x.demo?' · demostración':''}</small></div></div><div style="display:flex;gap:5px"><button data-action="select-profile" data-id="${h(x.id)}">${x.id===state.activeProfile?'Activo':'Elegir'}</button><button data-action="edit-profile" data-id="${h(x.id)}">Editar</button></div></div>`).join('')}<div class="selected-surface" style="margin-top:15px"><strong>Privacidad</strong>Los perfiles se almacenan únicamente en este navegador. No se suben al repositorio ni se comparten automáticamente con otros dispositivos.</div></section><section class="surface panel-pad profile-editor"><div class="subheading"><div><h2>${p?'Editar perfil':'Nuevo perfil'}</h2></div>${icon('users')}</div>${renderProfileForm(p)}</section></div>`;}
function renderProfileForm(p){const current=p||{name:'',ageYears:2,ageMonths:3,weight:'',height:'',restrictions:[],excluded:'',school:false};return `<form id="profile-form" data-profile-id="${h(p?.id||'')}"><div class="field"><label for="pf-name">Nombre o apodo *</label><input id="pf-name" name="name" maxlength="45" value="${h(current.name)}" placeholder="Ej. Alex" required/></div><div class="form-row"><div class="field"><label for="pf-age">Edad en años *</label><input id="pf-age" name="ageYears" type="number" min="1" max="16" step="1" value="${h(current.ageYears)}" required /></div><div class="field"><label for="pf-month">Meses adicionales</label><input id="pf-month" name="ageMonths" type="number" min="0" max="11" step="1" value="${h(current.ageMonths)}" /></div></div><div class="form-row"><div class="field"><label for="pf-weight">Peso actual (kg) · opcional</label><input id="pf-weight" name="weight" type="number" min="1" max="250" step="0.1" value="${h(current.weight)}"/></div><div class="field"><label for="pf-height">Estatura (cm) · opcional</label><input id="pf-height" name="height" type="number" min="40" max="230" step="0.1" value="${h(current.height)}"/></div></div><div class="divider"></div><div class="field"><label>Alergias conocidas (14 grupos regulados)</label><small>«Ninguna conocida» por defecto. Este prototipo no evalúa la seguridad de recetas; no sustituye el control de etiquetas.</small><div class="pill-collection" style="margin-top:9px">${ALLERGENS.map(([key,label])=>`<label class="pill ${current.restrictions?.includes(key)?'selected':''}"><input type="checkbox" name="restriction" value="${key}" ${current.restrictions?.includes(key)?'checked':''} style="position:absolute;opacity:0;width:1px;height:1px"/>${h(label)}</label>`).join('')}</div></div><div class="field" style="margin-top:13px"><label for="pf-excluded">Otros alimentos excluidos / preferencias</label><textarea id="pf-excluded" name="excluded" placeholder="Uno por línea, p. ej. kiwi">${h(curr body=`${blocked?`<div class="modal-safe">${icon('alert')} Se han declarado restricciones en el perfil. La sustitución automática está desactivada: este catálogo NO está validado para alergias.</div>`:''}${knownHits.length?`<div class="form-error">Atención: el plato seleccionado contiene alérgenos declarados (${knownHits.map(k=>h(ALLERGENS.find(x=>x[0]===k)?.[1]||k)).join(', ')}). No lo consideres apto.</div>`:''}<div class="selected-surface"><strong>Plato actual: ${h(meal.external?'Comida externa':r?.name||'Sin definir')}</strong>${meal.external?'No se contabiliza en la lista de compra':`Ingredientes: ${h((r?.ingredients||[]).map(x=>x.name).join(', '))||'Sin ingredientes'}. Cantidades editables.`}</div>${r&&!meal.external?recipeDetails(r):''}${!meal.external?preparationReuseMarkup(m.day,m.slot):''}<div class="pill-collection" style="margin:16px 0"><button class="pill ${editingMealTab==='suggestions'?'selected':''}" data-action="modal-tab" data-tab="suggestions">Sustituir</button><button class="pill ${editingMealTab==='custom'?'selected':''}" data-action="modal-tab" data-tab="custom">Crear / editar plato</button></div>${editingMealTab==='suggestions'?`<div style="max-height:270px;overflow:auto">${options.map(x=>`<button class="recipe-option" data-action="choose-recipe" data-recipe="${x.id}" ${blocked?'disabled title="Pendiente de validación para perfiles con restricciones"':''}><span><b>${h(x.name)}</b><small>${h(x.ingredients.map(i=>i.name).join(', '))}</small></span>${icon('chevronright')}</button>`).join('')}</div>`:customRecipeForm(m.day,m.slot,r)}<label class="feature-row"><span><b>Comida fuera / comedor escolar</b><small>Excluir esta toma de la lista de compra</small></span><input type="checkbox" class="switch" data-action="external-meal" ${meal.external?'checked':''}/></label><label class="feature-row"><span><b>Fijar este plato</b><small>No cambiarlo al generar otra combinación</small></span><input type="checkbox" class="switch" data-action="lock-meal" ${meal. }else if(m.type==='new-recipe'){title='Plato personalizado';caption='Introduce ingredientes y, si lo deseas, cantidades medidas.';body=customRecipeForm(m.day,m.slot);foot=`<button class="btn outline" data-action="close-modal">Cancelar</button>`;}

function customRecipeForm(day,slot,r){let lines=(r?.ingredients||[]).map(x=>`${x.name} | ${x.qty??''} | ${x.unit||'g'}`).join('\n');return `<form id="recipe-form" data-day="${day}" data-slot="${slot}" data-week-key="${h(mealKey())}"><div class="field"><label for="recipe-name">Nombre del plato *</label><input id="recipe-name" name="name" value="${h(r?.name||'')}" maxlength="100" required placeholder="Ej. Arroz con calabacín"/></div><div class="field"><label for="recipe-group">Grupo principal · clasificación visual</label><select id="recipe-group" name="group">${GROUPS.map(([k,name])=>`<option value="${k}" ${r?.group===k?'selected':''}>${h(name)}</option>`).join('')}</select></div><div class="field"><label for="recipe-ingredients">Ingredientes (uno por línea)</label><textarea id="recipe-ingredients" rows="6" name="ingredients" placeholder="Arroz |  | g&#10;Tomate |  | g">${h(lines)}</textarea><small>Formato: ingrediente | cantidad | unidad (g, ml o ud). Introduce tus propias cantidades.</small></div><div id="recipe-error" class="form-error" hidden></div><button type="submit" class="btn primary" style="width:100%">${icon('check')}Guardar plato en esta toma</button></form>`;}

function safeAccent(){return /^#[0-9a-f]{6}$/i.test(state.settings.accent)?state.settings.accent:'#285ea8';}
function luminance(hex){const v=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2];}
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function readableAccent(hex,paper){let rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16));const target=luminance(paper)>.5?0:255;for(let i=0;i<=100;i++){const result='#'+rgb.map(v=>Math.round(v+(target-v)*i/100).toString(16).padStart(2,'0')).join('');if(contrast(result,paper)>=4.5)return result;}return target?'#ffffff':'#000000';}
function mixAccent(accent,base,weight){const a=accent.slice(1).match(/../g).map(x=>parseInt(x,16)),b=base.slice(1).match(/../g).map(x=>parseInt(x,16));return '#'+a.map((v,i)=>Math.round(v*weight+b[i]*(1-weight)).toString(16).padStart(2,'0')).join('');}
function appearancePalette(accent,dark){const base=dark?'#191b20':'#ffffff';const palette={'--bg':mixAccent(accent,base,dark?.07:.035),'--paper':dark?'#24262b':'#ffffff','--paper2':mixAccent(accent,base,dark?.15:.065),'--line':mixAccent(accent,base,dark?.28:.17),'--green2':mixAccent(accent,base,dark?.34:.14),'--accent-edge':mixAccent(accent,base,dark?.65:.48),'--ink':dark?'#f0f1f4':'#293039','--readable':dark?'#c3c8d0':'#505b68','--muted':dark?'#c3c8d0':'#505b68','--accent-fill':accent,'--accent-on':contrast(accent,'#ffffff')>=contrast(accent,'#000000')?'#ffffff':'#000000'};const surfaces=['--bg','--paper','--paper2','--green2'].map(k=>palette[k]).sort((a,b)=>luminance(a)-luminance(b)),anchor=dark?surfaces.at(-1):surfaces[0];palette['--green']=readableAccent(accent,anchor);palette['--readable']=readableAccent(palette['--readable'],anchor);palette['--muted']=palette['--readable'];return palette;}
function applyAppearance(){const root=document.documentElement,palette=appearancePalette(safeAccent(),state.settings.theme==='dark');root.style.fontSize=({normal:16,large:18,extra:20}[state.settings.textSize]||16)+'px';for(const [key,value] of Object.entries(palette))root.style.setProperty(key,value);}

function render(){if(!state.profiles.length){state.profiles=[{...DEMO_PROFILE}];state.activeProfile='demo';}document.documentElement.dataset.theme=state.settings.theme||'light';applyAppearance();document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-symbol">${mandarinLogo()}</span><div><div class="brand-title">Menú Infantil</div><div class="brand-sub">En familia</div></div></div><nav aria-label="Navegación principal"><div class="nav-label">Tu espacio</div><div class="nav-list">${navMarkup()}</div></nav><div class="sidebar-spacer"></div><div class="footer-tag">Planificador familiar · v${VERSION}</div></aside><main class="main"><header class="topbar"><div class="breadcrumbs"><span class="mobile-brand">${mandarinLogo()}<b>Menú Infantil</b></span><span class="breadcrumb-path">Tu espacio <span style="padding:0 8px;color:#b4bcb3">/</span> <b>${state.view==='week'?'Semana':state.view==='generate'?'Generar':state.view==='shopping'?'Compra':state.view==='profiles'?'Perfiles':state.view==='recipes'?'Recetario':'Ajustes'}</b></span></div><div class="top-actions"><select class="profile-select" aria-label="Perfil activo" data-action="select-profile-input">${state.profiles.map(p=>`<option value="${h(p.id)}" ${p.id===state.activeProfile?'selected':''}>${h(p.name)}</option>`).join('')}</select><button class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema" data-action="theme">${icon(state.settings.theme==='dark'?'moon':'sun')}</button><button class="icon-btn" title="Imprimir menú" aria-label="Imprimir menú" data-action="print-menu">${icon('printer')}</button></div></header><div class="content">${heading()}${notice()}${state.view==='week'?renderWeek():state.view==='generate'?renderGenerate():state.view==='shopping'?renderShopping():state.view==='profiles'?renderProfiles():state.view==='recipes'?renderRecipes():renderSettings()}<p class="pediatric-footer">Cantidades y valores orientativos. Consulta siempre function updateMenu(day,slot,mut){if(!Number.isInteger(day)||day<0||day>6||!SLOTS.some(([key])=>key===slot)||schoolMeal(day,slot))return;const before=varietyReview(),current=menu(),meal={...current.days[day][slot]};mut(meal);const next={...state,menus:{...state.menus,[mealKey()]:{...current,days:current.days.map((d,n)=>n===day?{...d,[slot]:meal}:d)}}};if(commitUserState(next))rememberVarietyChange(before);render();}
function generateDemo(){varietyChange=null;const p=profile();if((p.restrictions||[]).length||String(p.excluded||'').trim()){notify('Generación bloqueada: el perfil tiene restricciones sin motor de seguridad validado. Puedes editar manualmente.');return;}const old=menu(),fresh=createDemoMenu();fresh.seed=(old.seed||0)+1;for(let day=0;day<7;day++)for(const [slot] of SLOTS){if(schoolMeal(day,slot)){fresh.days[day][slot]={recipeId:null,external:false,locked:false};continue;}if(old.days[day][slot].locked){fresh.days[day][slot]={...old.days[day][slot]};continue;}fresh.days[day][slot].recipeId=demoPick(slot,day,Math.abs(fresh.seed)%91);}state.menus[mealKey()]=fresh;const saved=save();state.view='week';render();if(saved)notify('Nueva combinación de platos de ejemplo. No constituye un menú nutricional validado.');}
function saveProfile(form){const data=new FormData(form);const name=String(data.get('name')||'').trim();const years=Number(data.get('ageYears'));const months=Number(data.get('ageMonths')||0);if(!name||name.length>45||!Number.isInteger(years)||years<1||years>16||!Number.isInteger(months)||months<0||months>11){errorForm('profile-error','Indica un nombre y una edad entre 1 año y 16 años y 11 meses.');return;}const weight=String(data.get('weight')||''),height=String(data.get('height')||'');if((weight&&(!Number.isFinite(+weight)||+weight<1||+weight>250))||(height&&(!Number.isFinite(+height)||+height<40||+height>230))){errorForm('profile-error','Revisa el peso y la estatura.');return;}if(String(data.get('excluded')||'').length>10000||data.getAll('restriction').some(x=>!ALLERGENS.some(([key])=>key===x))){errorForm('profile-error','Revisa las restricciones del perfil.');return;}if(data.has('school')&&!data.getAll('schoolDay').length){errorForm('profile-error','Elige al menos un día de comedor.');return;}const schoolMeals=data.getAll('schoolMeal').length?data.getAll('schoolMeal'):['lunch'];if(schoolMeals.some(slot=>!SCHOOL_SLOTS.includes(slot))){errorForm('profile-error','Revisa las tomas en el colegio.');return;}const nutritionSexValue=String(data.get('nutritionSex')||'reference'),nutritionPAL=String(data.get('nutritionPAL')||'auto');if(!['reference','male','female'].includes(nutritionSexValue)||!['auto','1.4','1.6','1.8','2'].includes(nutritionPAL)||(years<4&&!['auto','1.4'].includes(nutritionPAL))){errorForm('profile-error','Revisa el sexo de referencia y la actividad. Antes de 4 años se usa PAL 1,4.');return;}const schoolMode=String(data.get('schoolMode')||'record');if(!['record','complement'].includes(schoolMode)){errorForm('profile-error','Revisa cómo usar el menú del colegio.');return;}const previous=state.profiles.find(p=>p.id===form.dataset.profileId);const p={id:previous?.id||id(),schoolMode,schoolEstimates:data.has('schoolEstimates'),nutritionSex:nutritionSexValue  for(const field of ['menus','schoolLogs','schoolNutrition','schoolPlans','schoolDishes','pantry','shoppingSizes','purchased'])next[field]=Object.fromEntries(Object.entries(state[field]).filter(([key])=>!key.startsWith(pid+'|')));
 if(next.activeProfile===pid)next.activeProfile=next.profiles[0].id;
 try{const {modal,...stored}=next;localStorage.setItem(STORAGE_KEY,JSON.stringify(stored));}catch{notify('No se pudo eliminar el perfil. Los datos se han conservado.');return false;}
 state=next;editingProfileId=state.activeProfile;render();notify('Perfil eliminado.');return true;
}
function createShoppingPdf(){
 if(!window.jspdf?.jsPDF||!window.MENU_PDF_FONT)throw Error('No se ha cargado el generador de PDF. Recarga la app e inténtalo de nuevo.');
 const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true,putOnlyUsedFonts:true});
 doc.addFileToVFS('NotoSans-Regular.ttf',window.MENU_PDF_FONT);doc.addFont('NotoSans-Regular.ttf','MenuSans','normal');doc.setFont('MenuSans','normal');
 doc.setProperties({title:'Lista de la compra · '+weekLabel(),author:'Menú Infantil'});
 const width=doc.internal.pageSize.getWidth(),height=doc.internal.pageSize.getHeight(),margin=35,palette=appearancePalette(safeAccent(),false),data=shoppingData();let y=0;
 const text=(value,x,top,size=10,color='#293039')=>{doc.setFontSize(size);doc.setTextColor(color);doc.text(value,x,top);};
 const split=(value,w)=>{doc.setFontSize(10);return doc.splitTextToSize(menuPdfText(value),w);};
 function header(){text('Lista de la compra',margin,38,20,palette['--green']);text(weekLabel(),margin,59,11);const lines=split('Perfil: '+profile().name,width-2*margin);text(lines,margin,79);y=90+lines.length*14;}
 function groupHeader(label){doc.setFillColor(palette['--green2']);doc.roundedRect(margin,y,width-2*margin,25,4,4,'F');text(label,margin+8,y+17,10,palette['--green']);y+=32;}
 header();text('Incluye todos los ingredientes. Los comprados aparecen marcados.',margin,y,9,'#505b68');y+=24;
 if(!data.items.length)text('No hay ingredientes en esta semana.',margin,y);
 const grouped=new Map();for(const item of data.items){const group=(typeof shoppingGroup==='function'?shoppingGroup(item):(GROUPS.find(([key])=>key===item.group)?.[1]||'Otros'));if(!grouped.has(group))grouped.set(group,[]);grouped.get(group).push(item);}
 for(const [group,items] of (typeof shoppingGroupOrder==='function'?[...grouped].sort((a,b)=>shoppingGroupOrder(a[0])-shoppingGroupOrder(b[0])):grouped)){if(y+85>height-50){doc.addPage();header();}groupHeader(group);
  for(const item of items){let lines=split(item.name+' · '+shoppingAmount(item),width-2*margin-29),continued=false;
   while(lines.length){if(y+35>height-50){doc.addPage();header();groupHeader(group+' (cont.)');}
    const capacity=Math.max(1,Math.floor((height-50-y-12)/14)),chunk=lines.splice(0,capacity),rowHeight=Math.max(28,chunk.length*14+12);
    if(!continued){doc.setDrawColor('#505b68');doc.rect(margin+2,y+4,11,11);if(typeof shoppingChecked==='function'?shoppingChecked(item):state.purchased[purchaseKey(item)]){doc.line(margin+4,y+9,margin+7,y+12);doc.line(margin+7,y+12,margin+12,y+6);}}
    text(chunk,margin+23,y+14);y+=rowHeight;continued=true;
   }
  }
  y+=8;
 }
 for(let page=1;page<=doc.getNumberOfPages();page++){doc.setPage(page);text('App creada por Jesús Venegas · Comidas externas y del colegio excluidas.',margin,height-25,8,'#505b68');doc.text(page+' / '+doc.getNumberOfPages(),width-margin,height-25,{align:'right'});}
 return new File([doc.output('arraybuffer')],'menu-infantil-compra-'+state.week+'.pdf',{type:'application/pdf'});
}

function canShareMenuPdf(file){try{return typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&navigator.canShare({files:[file]});}catch{return false;}}
function downloadMenuPdf(){
 if(!preparedMenuPdf)return;
 const url=URL.createObjectURL(preparedMenuPdf),a=document.createElement('a');a.href=url;a.download=preparedMenuPdf.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 notify('PDF preparado para descargar. Puedes adjuntarlo o guardarlo.');
}
async function shareMenuPdf(retry=false,kind='menu'){
 if(pdfShareBusy)return;
 try{
  if(!retry||!preparedMenuPdf){preparedMenuPdf=null;preparedPdfKind=kind;preparedMenuPdf=kind==='shopping'?createShoppingPdf():createMenuPdf();}
  if(!canShareMenuPdf(preparedMenuPdf)){openModal('pdf-share');return;}
  pdfShareBusy=true;
  // Sin espera de red: conserva la activación del botón para abrir el selector nativo.
  await navigator.share({files:[preparedMenuPdf],title:preparedPdfKind==='shopping'?'Lista de la compra':'Menú semanal'});
  if(state.modal?.type==='pdf-share')closeModal();
 }catch(error){if(error.name==='AbortError')return;if(preparedMenuPdf)openModal('pdf-share',{shareFailed:true});else notify(error.message||'No se pudo preparar el PDF.');}
 finally{pdfShareBusy=false;}
}

// Eventos delegados: no se transmiten datos por red.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='scrim'&&e.target!==el)return;if(['purchase','select-profile-input','slot-toggle','dark-mode','lock-meal','external-meal'].includes(action))return;

if(action==='meal'){if(schoolMeal(Number(el.dataset.day),el.dataset.slot))return;editingMealTab='suggestions';openModal('meal',{day:Number(el.dataset.day),slot:el.dataset.slot});return;}
if(action==='modal-tab'){editingMealTab=el.dataset.tab;render();return;}
if(action==='choose-recipe'){if((profile().restrictions||[]).length||String(profile().excluded||'').trim()){notify('Sustitución automática bloqueada por restricciones sin validar.');return;}const modal=state.modal;if(!modal||modal.type!=='meal')return;const selected=familyCatalog().find(r=>r.id===el.dataset.recipe&&r.slots.includes(modal.slot));if(!selected){notify('Elige una ficha de la etapa actual.');return;}if(typeof replaceQuantifiedMeal==='function'){replaceQuantifiedMeal(selected,modal.day,modal.slot);return;}updateMenu(modal.day,modal.slot,m=>{m.recipeId=selected.id;m.external=false;});state.modal=null;render();return;}
if(action==='close-modal'||action==='scrim'){closeModal();return;}
if(action==='new-profile'){editingProfileId='new';render();document.getElementById('profile-form')?.closest('section')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(action==='edit-profile'){editingProfileId=el.dataset.id;render();return;}
if(action==='select-profile'){state.activeProfile=el.dataset.id;editingProfileId=el.dataset.id;save();render();return;}
if(action==='delete-profile'){if(state.profiles.length<2){notify('Necesitas conservar al menos un perfil.');return;}if(state.profiles.some(p=>p.id===el.dataset.id))openModal('delete-profile',{id:el.dataset.id});return;}
if(action==='confirm-delete-profile'){if(state.modal?.type==='delete-profile')deleteProfile(state.modal.id);return;}
if(action==='generate-family'){generateFamilyMenu();return;}
if(action==='generate-demo'){generateDemo();return;}
if(action==='blank-week'){varietyChange=null;if(!confirm('¿Crear una semana en blanco? Sustituirá esta semana pero conservará los platos que hayas fijado.'))return;const old=menu();const blank={days:DAYS.map((_,di)=>Object.fromEntries(SLOTS.map(([slot])=>[slot,!(schoolMeal(di,slot))&&old.days[di][slot].locked?{...old.days[di][slot]}:{recipeId:null,locked:false,external:false}]))),seed:0,kind:'manual',createdAt:new Date().toISOString()};const saved=commitUserState({...state,menus:{...state.menus,[mealKey()]:blank},view:'week'});render();if(saved)notify('Semana en blanco preparada. Toca cualquier toma para crear un plato.');return;}
if(action==='print-menu'||action==='print-shopping'){printDocument(action==='print-menu'?'menu':'shopping');return;}
if(action==='uncheck-all'){const purchased={...state.purchased};for(const item of shoppingData().items)purchased[purchaseKey(item)]=false;commitUserState({...state,purchased});render();return;}
if(action==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();return;}
if(action==='reset-demo'){if(!confirm('¿Borrar todos los perfiles, menús y ajustes de este dispositivo?'))return;if(!commitUserState(defaultState()))return;editingProfileId=null;render();notify('Demostración restablecida.');return;}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='backup-file'){const file=el.files?.[0];el.value='';prepareRestore(file);return;}if(el.name==='school'||el.name==='schoolDay'||el.name==='schoolMeal'){saveSchoolControls(el);return;}if(el.matches('input[name="restriction"]')){el.closest('label')?.classList.toggle('selected',el.checked);return;}const action=el.dataset.action;if(action==='text-size'){state.settings.textSize=['normal','large','extra'].includes(el.value)?el.value:'normal';save();render();return;}if(action==='accent-color'){state.settings.accent=el.value;save();render();return;}if(action==='select-profile-input'){state.activeProfile=el.value;editingProfileId=el.value;save();render();return;}if(action==='purchase'){if(typeof updateSmartPurchased==='function'){updateSmartPurchased(el);return;}const key=mealKey()+'|'+el.dataset.item.toLocaleLowerCase('es');state.purchased[key]=el.checked;save();render();return;}if(action==='dark-mode'){state.settings.theme=el.checked?'dark':'light';save();render();return;}if(action==='slot-toggle'){const yes=Object.values(state.settings.meals).filter(Boolean).length;if(!el.checked&&yes<=1){notify('Debe quedar al menos una toma activa.');render();return;}state.settings.meals[el.dataset.slot]=el.checked;save();render();return;}if(action==='lock-meal'||action==='external-meal'){const mm=state.modal;if(!mm)return;updateMenu(mm.day,mm.slot,m=>{m[action==='lock-meal'?'locked':'external']=el.checked;});return;}});
document.addEventListener('submit',e=>{if(e.target?.matches('.nutrition-form, .nutrition-library')){e.preventDefault();submitNutritionForm(e.target);return;}if(e.target?.id==='school-form'){e.preventDefault();const form=e.target,day=Number(form.dataset.day),slot=form.dataset.slot||'lunch';if(!schoolMeal(day,slot))return;try{if(form.dataset.weekKey&&form.dataset.weekKey!==mealKey())throw Error('La semana ha cambiado. Abre de nuevo el registro.');const value=String(new FormData(form).get('food')||'').trim().slice(0,1500),entries=typeof readSchoolNutrition==='function'?readSchoolNutrition(form):[],logs={...state.schoolLogs},quantities={...state.schoolNutrition};if(value)logs[schoolKey(day,slot)]=value;else delete logs[schoolKey(day,slot)];if(entries.length)quantities[schoolKey(day,slot)]=entries;else delete quantities[schoolKey(day,slot)];const next={...state,schoolLogs:logs,schoolNutrition:quantities,modal:null};const {modal,...stored}=next;localStorage.setItem(STORAGE_KEY,JSON.stringify(stored));state=next;render();notify('Registro del colegio guardado.');}catch(error){const output=document.getElementById('school-nutrition-error');if(output)output.textContent=error.message;}return;}if(e.target?.id==='profile-form'){e.preventDefault();saveProfile(e.target);}if(e.target?.id==='recipe-form'){e.preventDefault();saveRecipe(e.target);}});
