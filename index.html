function icon(name){return `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'local-'+Date.now()+'-'+Math.floor(Math.random()*10000);}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function startWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return iso(d);}
function fmtNum(n){return new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(n);}

const RECIPE_BY_ID=Object.fromEntries(RECIPES.map(r=>[r.id,r]));

const defaultState=()=>({version:VERSION,profiles:[{...DEMO_PROFILE}],activeProfile:'demo',week:startWeek(new Date()),selectedDay:(new Date().getDay()+6)%7,menus:{},customRecipes:{},purchased:{},view:'week',settings:{...DEFAULT_SETTINGS},modal:null});
function readState(){try{const o=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!o||!Array.isArray(o.profiles)||!o.settings)return defaultState();return {...defaultState(),...o,settings:{...DEFAULT_SETTINGS,...o.settings,meals:{...DEFAULT_SETTINGS.meals,...(o.settings.meals||{})}},modal:null};}catch{return defaultState();}}
let state=readState();let editingProfileId=null;let editingMealTab='suggestions';let toastTimer;
function save(){try{const {modal,...stored}=state;localStorage.setItem(STORAGE_KEY,JSON.stringify(stored));}catch(e){notify('No se pudieron guardar los datos en este navegador.');}}
function profile(){return state.profiles.find(p=>p.id===state.activeProfile)||state.profiles[0];}
function mealKey(profileId=state.activeProfile,week=state.week){return profileId+'|'+week;}
function slotLabel(key){return (SLOTS.find(x=>x[0]===key)||[])[1]||key;}
function recipeById(id){return RECIPE_BY_ID[id]||state.customRecipes[id];}
function demoPick(slot,day,seed){const opts=RECIPES.filter(r=>r.slot===slot);const rotations={breakfast:0,midmorning:3,lunch:1,snack:2,dinner:0};return opts[(day*(slot==='lunch'?3:2)+seed+rotations[slot])%opts.length]?.id;}
function createDemoMenu(){let seed=Math.round((parseDate(state.week)-parseDate('2026-10-12'))/86400000);let days=[];for(let day=0;day<7;day++){const meals={};for(const [slot] of SLOTS)meals[slot]={recipeId:demoPick(slot,day,Math.abs(seed)%11),locked:false,external:false};days.push(meals);}return {days,seed,kind:'demo',createdAt:new Date().toISOString()};}
function menu(){const key=mealKey();if(!state.menus[key]){state.menus[key]=createDemoMenu();save();}return state.menus[key];}
function activeMeals(){return SLOTS.filter(([key])=>state.settings.meals[key]);}
function openModal(type,data={}){state.modal={type,...data};render();const first=document.querySelector('.modal input:not([type=checkbox]),.modal textarea');if(first&&type==='custom')first.focus();}
function closeModal(){state.modal=null;render();}
function notify(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;z-index:300;bottom:93px;left:50%;transform:translateX(-50%);max-width:92vw;padding:12px 20px;color:white;background:#315941;border-radius:13px;font-size:12px;box-shadow:0 10px 30px #0002;text-align:center;line-height:1.55';document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4200);}

function heading(){const values={week:['Planificación semanal','Tu semana, un poco más fácil.','Organiza las comidas, ajusta cada plato y lleva la compra al día.'],generate:['Planificador','Una semana hecha a tu manera.','Cambia los platos de demostración o empieza a crear un menú propio.'],shopping:['Lista de la compra','Todo lo que necesitas.','Los ingredientes se reúnen automáticamente desde el menú que has preparado.'],profiles:['Perfiles infantiles','Cada niño, su propio menú.','Prepara perfiles independientes con necesidades y restricciones particulares.'],settings:['Preferencias','Un espacio a tu medida.','Elige qué mostrar y cómo prefieres utilizar la aplicación.']};const [small,title,desc]=values[state.view]||values.week;return `<div class="hero"><div><div class="eyebrow">${small} · V0.2</div><h1>${title}</h1><p class="lead">${desc}</p></div><div class="hero-glyph">${icon(state.view==='week'?'leaf':'sparkles')}</div></div>`;}
function notice(){const p=profile();let count=0;if(p.restrictions?.length){for(const day of menu().days)for(const [slot] of activeMeals()){const m=day[slot],r=recipeById(m?.recipeId);if(!m?.external&&r&&(r.allergens||[]).some(a=>p.restrictions.includes(a)))count++;}}const restrictionWarning=(p.restrictions?.length||String(p.excluded||'').trim())?`<div style="margin-top:5px"><strong>Perfil con restricciones:</strong> sin validación de seguridad. ${count?`Se han detectado ${count} tomas con alérgenos declarados en las etiquetas de ejemplo. `:''}No utilizar la planificación para comer.</div>`:'';return `<div class="notice" role="note">${icon('info')}<div><strong>Prototipo de interfaz, no plan nutricional.</strong> Los platos son ejemplos para probar navegación, edición y compras. <strong>No existen raciones pediátricas calculadas ni revisión de recetas.</strong> No lo utilices para decidir qué debe comer un menor.${restrictionWarning}</div></div>`;}
function weekLabel(){const a=parseDate(state.week),b=parseDate(addDays(state.week,6));return `${a.getDate()}–${b.getDate()} ${a.getMonth()===b.getMonth()?MONTHS[b.getMonth()]:MONTHS[a.getMonth()]+' / '+MONTHS[b.getMonth()]} ${b.getFullYear()}`;}

function mealCard(day,slot,mobile=false){const {m,recipe}=mealData(day,slot);const title=m?.external?'Comida fuera / comedor':recipe?.name||'Sin definir';const detail=m?.external?'No se incluye en la compra':m?.locked?'Plato fijado · cantidades sin validar':'Cantidades por validar';if(!mobile)return `<button type="button" class="meal-cell ${m?.external?'external':''}" data-action="meal" data-day="${day}" data-slot="${slot}" aria-label="Editar ${h(slotLabel(slot))} del ${DAYS[day]}"><span class="meal-heading">${h(slotLabel(slot))}${icon(m?.locked?'lock':'edit')}</span><span class="meal-name">${h(title)}</span><span class="meal-detail">${h(detail)}</span></button>`;

return `<button type="button" class="mobile-meal" data-action="meal" data-day="${day}" data-slot="${slot}"><span class="meal-icon">${icon(slotIcons[slot])}</span><span class="mobile-meal-main"><span class="meal-heading">${h(slotLabel(slot))}${m.locked?' · FIJADO':''}</span><span class="meal-name">${h(title)}</span><span class="meal-detail">${h(detail)}</span></span><span class="chev">${icon('chevronright')}</span></button>`;}
function renderWeek(){const today=iso(new Date());const selected=Math.max(0,Math.min(6,state.selectedDay));const date=addDays(state.week,selected);let grid=DAYS.map((name,day)=>`<div class="day-col ${addDays(state.week,day)===today?'today':''}"><div class="day-head"><span class="day-name">${name}</span><span class="day-num">${parseDate(addDays(state.week,day)).getDate()} <small>${MONTHS[parseDate(addDays(state.week,day)).getMonth()].slice(0,3)}</small></span></div>${activeMeals().map(([slot])=>mealCard(day,slot)).join('')}</div>`).join('');return `<section class="surface"><div class="section-top"><div><h2>Menú de la semana</h2><p>Haz clic en cualquier plato para editarlo o sustituirlo.</p></div><div class="toolbar">${weekControls()}<button class="btn outline" data-action="print-menu">${icon('printer')}<span>Imprimir / PDF</span></button><button class="btn primary" data-action="nav" data-view="generate">${icon('wand')}Nuevo menú</button></div></div><div class="week-grid-wrap"><div class="week-grid">${grid}</div></div><div class="mobile-week"><div class="mobile-day-selector">${DAYS.map((d,i)=>`<button class="day-pick ${selected===i?'active':''}" data-action="day" data-day="${i}" aria-label="Mostrar ${d}" aria-pressed="${selected===i}"><span>${d.slice(0,1)}</span><b>${parseDate(addDays(state.week,i)).getDate()}</b></button>`).join('')}</div><div style="padding:13px 17px 2px;color:#769181;font-size:11px;font-weight:700">${DAYS[selected]}, ${parseDate(date).getDate()} de ${MONTHS[parseDate(date).getMonth()]}</div>${activeMeals().map(([slot])=>mealCard(selected,slot,true)).join('')}<div style="height:14px"></div></div></section>${summaryPanels()}`;}
function chartCounts(){const counts=Object.fromEntries(GROUPS.map(x=>[x[0],0]));let count=0;for(const day of menu().days)for(const [slot] of activeMeals()){const meal=day[slot];if(meal&&!meal.external){const r=recipeById(meal.recipeId);if(r){counts[r.group]=(counts[r.group]||0)+1;count++;}}}return {counts,count};}
function chartMarkup(){const {counts,count}=chartCounts();let offset=0;const circles=GROUPS.map(([k,,c])=>{const v=count?counts[k]/count:0;let x=`<circle cx="80" cy="80" r="55" fill="none" stroke="${c}" stroke-width="21" stroke-dasharray="${v*345.575} 345.575" stroke-dashoffset="${-offset*345.575}" />`;offset+=v;return x;}).join('');return `<div class="chart-layout"><svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Distribución ilustrativa de ${count} platos de ejemplo por categoría"><circle cx="80" cy="80" r="55" stroke="#edf2ec" stroke-width="21" fill="none"/>${circles}<text x="80" y="75" text-anchor="middle" fill="var(--ink)" font-size="27" font-weight="780">${count}</text><text x="80" y="94" text-anchor="middle" fill="var(--muted)" font-size="11">platos</text></svg><div class="chart-legend">${GROUPS.map(([k,label,c])=>`<div class="legend-item"><i class="dot" style="background:${c}"></i><span>${label} · ${counts[k]||0}</span></div>`).join('')}</div></div>`;}
function shoppingData(){const map=new Map();let unspecified=0,externalCount=0;for(const day of menu().days)for(const [slot] of activeMeals()){const m=day[slot];if(m?.external){externalCount++;continue;}const r=recipeById(m?.recipeId);if(!r)continue;for(const ing of r.ingredients||[]){const key=ing.name.trim().toLocaleLowerCase('es');if(!key)continue;let v=map.get(key);if(!v){v={name:ing.name,group:ing.group||'otros',known:{},unknown:0};map.set(key,v);}if(Number.isFinite(ing.qty)&&ing.qty>0){v.known[ing.unit]=(v.known[ing.unit]||0)+ing.qty;}else{v.unknown++;unspecified++;}}}return {items:[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'es')),unspecified,externalCount};}
function summaryPanels(){const a=chartCounts(),b=shoppingData(),locked=menu().days.reduce((n,day)=>n+activeMeals().filter(([slot])=>day[slot].locked).length,0);return `<div class="summary-grid"><section class="surface summary-card"><div class="subheading"><div><h2>Tu semana de un vistazo</h2><p>Resumen de la planificación actual</p></div>${icon('calendar')}</div><div class="summary-mini"><div class="mini-box"><div class="mini-value">${a.count}</div><div class="mini-label">Tomas planificadas</div></div><div class="mini-box"><div class="mini-value">${b.items.length}</div><div class="mini-label">Ingredientes diferentes</div></div><div class="mini-box"><div class="mini-value">${locked}</div><div class="mini-label">Platos fijados</div></div></div><p class="chart-note">Las cantidades de alimentos están pendientes de verificar con fuentes pediátricas oficiales.</p></section><section class="surface summary-card"><div class="subheading"><div><h2>Distribución de platos</h2><p>Visualización provisional · no mide equilibrio nutricional</p></div>${icon('sparkles')}</div>${chartMarkup()}<p class="chart-note">El gráfico final se basará en raciones equivalentes verificadas, no en el número de platos.</p></section></div>`;}
function renderGenerate(){return `<section class="surface panel-pad"><div class="subheading"><div><h2>Generador de demostración</h2><p>Para evaluar la navegación y el funcionamiento. No aplica reglas clínicas.</p></div>${icon('wand')}</div><div class="generation-grid"><div class="generation-card">${icon('shield')}<h3>Perfiles independientes</h3><p>Los menús se guardan por niño y semana. Las alergias exigirán bloqueo clínicamente validado.</p></div><div class="generation-card">${icon('refresh')}<h3>Sustituciones sencillas</h3><p>Puedes cambiar una sola ingesta y dejar el resto de la semana intacto.</p></div><div class="generation-card">${icon('leaf')}<h3>Datos oficiales</h3><p>Las raciones y el algoritmo equilibrado están pendientes de incorporar y auditar.</p></div></div><div class="selected-surface"><strong>Antes de generar</strong>El botón mezcla platos de ejemplo de forma local. No personaliza gramos, calorías, textura ni seguridad por edad. Si el perfil contiene restricciones, la generación automática de prueba queda bloqueada para evitar aparentar que las verifica.</div><div style="display:flex;justify-content:flex-start;gap:10px;margin-top:22px;flex-wrap:wrap"><button class="btn primary" data-action="generate-demo">${icon('wand')}Generar combinación de ejemplo</button><button class="btn outline" data-action="blank-week">${icon('plus')}Empezar desde cero</button><button class="btn outline" data-action="nav" data-view="week">${icon('calendar')}Ver menú actual</button></div></section>`;}
function purchaseKey(item){return mealKey()+'|'+item.name.toLocaleLowerCase('es');}
function shoppingAmount(item){const entries=Object.entries(item.known);let a=entries.map(([unit,qty])=>fmtNum(qty)+' '+unit).join(' + ');if(item.unknown)a+=(a?' · ':'')+'cantidad sin especificar ('+item.unknown+')';return a||'Cantidad sin especificar';}
function renderShopping(){const data=shoppingData();const groups=new Map();for(const item of data.items){const k=GROUPS.find(x=>x[0]===item.group)?.[1]||'Otros';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(item);}const checked=data.items.filter(x=>state.purchased[purchaseKey(x)]).length;return `<div class="page-grid"><section class="surface panel-pad"><div class="subheading"><div><h2>Ingredientes de la semana</h2><p>${data.items.length} ingredientes · ${checked} marcados como comprados</p></div><button class="btn outline" data-action="print-shopping">${icon('printer')}Imprimir / PDF</button></div>${[...groups.entries()].map(([name,items])=>`<div class="group-heading"><span>${h(name)}</span><span>${items.length}</span></div>${items.map(item=>`<label class="shopping-row"><input type="checkbox" data-action="purchase" data-item="${h(item.name)}" ${state.purchased[purchaseKey(item)]?'checked':''}/><span class="shopping-name"><b style="${state.purchased[purchaseKey(item)]?'text-decoration:line-through;opacity:.65':''}">${h(item.name)}</b><small>${h(shoppingAmount(item))}</small></span>${icon('check')}</label>`).join('')}`).join('')}</section><aside class="surface panel-pad"><div class="subheading"><h2>Compra inteligente</h2>${icon('basket')}</div><div class="selected-surface"><strong>Sin cantidades inventadas</strong>Los platos de demostración no tienen cantidades predeterminadas. Al introducir gramos o piezas en el editor, se suman automáticamente aquí, indicando cuando existen otras cantidades pendientes.</div><div class="divider"></div><div class="stat-block">${icon('list')}<span>${data.items.length} ingredientes diferentes</span></div><div class="stat-block">${icon('clock')}<span>${data.unspecified} cantidades pendientes de definir</span></div><div class="stat-block">${icon('utensils')}<span>${data.externalCount} comidas externas excluidas</span></div><div class="divider"></div><button class="btn soft-btn" data-action="uncheck-all" style="width:100%">Desmarcar lista</button></aside></div>`;}
function ageLabel(p){return `${Number(p.ageYears)||0} años${Number(p.ageMonths)?' y '+p.ageMonths+' meses':''}`;}
function renderProfiles(){const p=editingProfileId==='new'?null:(state.profiles.find(x=>x.id===(editingProfileId||state.activeProfile))||null);return `<div class="page-grid"><section class="surface panel-pad"><div class="subheading"><div><h2>Perfiles guardados en este dispositivo</h2><p>Crea tantos perfiles como necesites; cada uno mantiene su menú.</p></div><button class="btn primary" data-action="new-profile">${icon('plus')}Añadir</button></div>${state.profiles.map(x=>`<div class="profile-card ${x.id===state.activeProfile?'active-profile':''}"><div class="profile-info"><span class="avatar">${h(x.name.slice(0,1).toUpperCase())}</span><div><b>${h(x.name)}</b><small>${h(ageLabel(x))}${x.demo?' · demostración':''}</small></div></div><div style="display:flex;gap:5px"><button data-action="select-profile" data-id="${h(x.id)}">${x.id===state.activeProfile?'Activo':'Elegir'}</button><button data-action="edit-profile" data-id="${h(x.id)}">Editar</button></div></div>`).join('')}<div class="selected-surface" style="margin-top:15px"><strong>Privacidad</strong>Los perfiles se almacenan únicamente en este navegador. No se suben al repositorio ni se comparten automáticamente con otros dispositivos.</div></section><section class="surface panel-pad"><div class="subheading"><div><h2>${p?'Editar perfil':'Nuevo perfil'}</h2><p>Datos básicos para la futura personalización</p></div>${icon('users')}</div>${renderProfileForm(p)}</section></div>`;}
function renderProfileForm(p){const current=p||{name:'',ageYears:5,ageMonths:0,weight:'',height:'',restrictions:[],excluded:'',school:false};return `<form id="profile-form"><div class="field"><label for="pf-name">Nombre o apodo *</label><input id="pf-name" name="name" maxlength="45" value="${h(current.name)}" placeholder="Ej. Alex" required/></div><div class="form-row"><div class="field"><label for="pf-age">Edad en años *</label><input id="pf-age" name="ageYears" type="number" min="1" max="16" step="1" value="${h(current.ageYears)}" required /></div><div class="field"><label for="pf-month">Meses adicionales</label><input id="pf-month" name="ageMonths" type="number" min="0" max="11" step="1" value="${h(current.ageMonths)}" /></div></div><div class="form-row"><div class="field"><label for="pf-weight">Peso actual (kg) · opcional</label><input id="pf-weight" name="weight" type="number" min="1" max="250" step="0.1" value="${h(current.weight)}"/></div><div class="field"><label for="pf-height">Estatura (cm) · opcional</label><input id="pf-height" name="height" type="number" min="40" max="230" step="0.1" value="${h(current.height)}"/></div></div><div class="divider"></div><div class="field"><label>Alergias conocidas (14 grupos regulados)</label><small>«Ninguna conocida» por defecto. Este prototipo no evalúa la seguridad de recetas; no sustituye el control de etiquetas.</small><div class="pill-collection" style="margin-top:9px">${ALLERGENS.map(([key,label])=>`<label class="pill ${current.restrictions?.includes(key)?'selected':''}"><input type="checkbox" name="restriction" value="${key}" ${current.restrictions?.includes(key)?'checked':''} style="position:absolute;opacity:0;width:1px;height:1px"/>${h(label)}</label>`).join('')}</div></div><div class="field" style="margin-top:13px"><label for="pf-excluded">Otros alimentos excluidos / preferencias</label><textarea id="pf-excluded" name="excluded" placeholder="Uno por línea, p. ej. kiwi">${h(current.excluded||'')}</textarea></div><label class="feature-row" style="margin-bottom:15px"><span><b>Come en el colegio</b><small>Permite señalar comidas externas por día</small></span><input class="switch" type="checkbox" name="school" ${current.school?'checked':''}/></label><div id="profile-error" class="form-error" hidden></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">${icon('check')}Guardar perfil</button>${p&&!p.demo?`<button class="btn danger-btn" type="button" data-action="delete-profile">${icon('trash')}Eliminar</button>`:''}</div></form>`;}
function renderSettings(){return `<div class="page-grid"><section class="surface panel-pad"><div class="subheading"><div><h2>Ajustes de visualización</h2><p>Preferencias guardadas de forma local</p></div>${icon('settings')}</div><div class="feature-row"><span><b>Modo oscuro</b><small>Colores adaptados a ambientes con menos luz</small></span><input type="checkbox" class="switch" data-action="dark-mode" ${state.settings.theme==='dark'?'checked':''}/></div><div class="divider"></div><h3 style="font-size:13px;margin-top:10px">Tomas que aparecen cada día</h3>${SLOTS.map(([key,label])=>`<label class="feature-row"><span><b>${label}</b><small>Mostrar en semana, compras y gráfico</small></span><input type="checkbox" class="switch" data-action="slot-toggle" data-slot="${key}" ${state.settings.meals[key]?'checked':''}/></label>`).join('')}</section><aside class="surface panel-pad"><div class="subheading"><h2>Datos y seguridad</h2>${icon('shield')}</div><div class="selected-surface"><strong>Almacenamiento local</strong>Esta versión de demostración utiliza localStorage. El producto final utilizará IndexedDB y copias de seguridad cifradas.</div><div class="divider"></div><button class="btn outline" data-action="reset-demo" style="width:100%">${icon('refresh')}Restablecer demostración</button><p class="chart-note">No introduzcas información clínica sensible durante las pruebas. Este prototipo no contiene sincronización automática ni valoración nutricional.</p></aside></div>`;}
function renderModal(){const m=state.modal;if(!m)return '';let title='',caption='',body='',foot='';if(m.type==='meal'){
const {m:meal,recipe:r}=mealData(m.day,m.slot);title=`${slotLabel(m.slot)} · ${DAYS[m.day]}`;caption='Edita únicamente esta toma; el resto de la semana se conserva.';const options=RECIPES.filter(x=>x.slot===m.slot);const restrictions=profile().restrictions||[];const knownHits=r?restrictions.filter(x=>r.allergens.includes(x)):[];
body=`${restrictions.length?`<div class="modal-safe">${icon('alert')} Se han declarado restricciones en el perfil. La sustitución automática está desactivada: este catálogo NO está validado para alergias.</div>`:''}${knownHits.length?`<div class="form-error">Atención: el plato seleccionado contiene alérgenos declarados (${knownHits.map(k=>ALLERGENS.find(x=>x[0]===k)?.[1]||k).join(', ')}). No lo consideres apto.</div>`:''}<div class="selected-surface"><strong>Plato actual: ${h(meal.external?'Comida externa':r?.name||'Sin definir')}</strong>${meal.external?'No se contabiliza en la lista de compra':`Ingredientes: ${h((r?.ingredients||[]).map(x=>x.name).join(', '))||'Sin ingredientes'}. Cantidades no validadas.`}</div><div class="pill-collection" style="margin:16px 0"><button class="pill ${editingMealTab==='suggestions'?'selected':''}" data-action="modal-tab" data-tab="suggestions">Sustituir</button><button class="pill ${editingMealTab==='custom'?'selected':''}" data-action="modal-tab" data-tab="custom">Crear / editar plato</button></div>${editingMealTab==='suggestions'?`<div style="max-height:270px;overflow:auto">${options.map(x=>`<button class="recipe-option" data-action="choose-recipe" data-recipe="${x.id}" ${restrictions.length?'disabled title="Pendiente de validación para perfiles con restricciones"':''}><span><b>${h(x.name)}</b><small>${h(x.ingredients.map(i=>i.name).join(', '))}</small></span>${icon('chevronright')}</button>`).join('')}</div>`:customRecipeForm(m.day,m.slot,r)}<label class="feature-row"><span><b>Comida fuera / comedor escolar</b><small>Excluir esta toma de la lista de compra</small></span><input type="checkbox" class="switch" data-action="external-meal" ${meal.external?'checked':''}/></label><label class="feature-row"><span><b>Fijar este plato</b><small>No cambiarlo al generar otra combinación</small></span><input type="checkbox" class="switch" data-action="lock-meal" ${meal.locked?'checked':''}/></label>`;
foot=`<button class="btn outline" data-action="close-modal">Cerrar</button>`;
}else if(m.type==='new-recipe'){title='Plato personalizado';caption='Introduce ingredientes y, si lo deseas, cantidades medidas.';body=customRecipeForm(m.day,m.slot);foot=`<button class="btn outline" data-action="close-modal">Cancelar</button>`;}
return `<div class="modal-scrim" data-action="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="modal-head"><div><h2>${h(title)}</h2><p>${h(caption)}</p></div><button class="icon-btn" aria-label="Cerrar ventana" data-action="close-modal">${icon('close')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`;}
function customRecipeForm(day,slot,r){let lines=(r?.ingredients||[]).map(x=>`${x.name} | ${x.qty??''} | ${x.unit||'g'}`).join('\n');return `<form id="recipe-form" data-day="${day}" data-slot="${slot}"><div class="field"><label for="recipe-name">Nombre del plato *</label><input id="recipe-name" name="name" value="${h(r?.name||'')}" maxlength="100" required placeholder="Ej. Arroz con calabacín"/></div><div class="field"><label for="recipe-group">Grupo principal · clasificación visual</label><select id="recipe-group" name="group">${GROUPS.map(([k,name])=>`<option value="${k}" ${r?.group===k?'selected':''}>${h(name)}</option>`).join('')}</select></div><div class="field"><label for="recipe-ingredients">Ingredientes (uno por línea)</label><textarea id="recipe-ingredients" rows="6" name="ingredients" placeholder="Arroz |  | g&#10;Tomate |  | g">${h(lines)}</textarea><small>Formato: ingrediente | cantidad | unidad. Ejemplo: «Arroz | 80 | g». Las cantidades son aportadas por el usuario, NO recomendaciones de la app. Unidad: g, ml o ud.</small></div><div class="modal-safe">${icon('info')} Los platos personalizados son libres. Esta versión no detecta alérgenos ocultos, ni valora cantidades, seguridad por edad o nutrición.</div><div id="recipe-error" class="form-error" hidden></div><button type="submit" class="btn primary" style="width:100%">${icon('check')}Guardar plato en esta toma</button></form>`;}
function render(){if(!state.profiles.length){state.profiles=[{...DEMO_PROFILE}];state.activeProfile='demo';}document.documentElement.dataset.theme=state.settings.theme||'light';document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-symbol">m</span><div><div class="brand-title">menú infantil</div><div class="brand-sub">En familia</div></div></div><nav aria-label="Navegación principal"><div class="nav-label">Tu espacio</div><div class="nav-list">${navMarkup()}</div></nav><div class="sidebar-spacer"></div><div class="sidebar-foot"><strong>${icon('heart')} Pensado para cuidar</strong><p>Una experiencia más sencilla para organizar las comidas familiares, siempre con seguridad y transparencia.</p></div><div class="footer-tag">Prototipo de diseño · v${VERSION}</div></aside><main class="main"><header class="topbar"><div class="breadcrumbs">Tu espacio <span style="padding:0 8px;color:#b4bcb3">/</span> <b>${state.view==='week'?'Semana':state.view==='generate'?'Generar':state.view==='shopping'?'Compra':state.view==='profiles'?'Perfiles':'Ajustes'}</b></div><div class="top-actions"><select class="profile-select" aria-label="Perfil activo" data-action="select-profile-input">${state.profiles.map(p=>`<option value="${h(p.id)}" ${p.id===state.activeProfile?'selected':''}>${h(p.name)}</option>`).join('')}</select><button class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema" data-action="theme">${icon(state.settings.theme==='dark'?'moon':'sun')}</button><button class="icon-btn" title="Imprimir menú" aria-label="Imprimir menú" data-action="print-menu">${icon('printer')}</button></div></header><div class="content">${heading()}${notice()}${state.view==='week'?renderWeek():state.view==='generate'?renderGenerate():state.view==='shopping'?renderShopping():state.view==='profiles'?renderProfiles():renderSettings()}<p class="main-foot">Menú Infantil V0.2 · Prototipo sin API externas · Los datos permanecen en este navegador · Ningún contenido ha sido validado para uso clínico.</p></div></main><nav class="mobile-nav" aria-label="Navegación móvil">${navMarkup(true)}</nav></div>${renderModal()}`;}
function updateMenu(day,slot,mut){const m=menu().days[day][slot];mut(m);save();render();}
function generateDemo(){const p=profile();if((p.restrictions||[]).length||String(p.excluded||'').trim()){notify('Generación bloqueada: el perfil tiene restricciones sin motor de seguridad validado. Puedes editar manualmente.');return;}const old=menu(),fresh=createDemoMenu();fresh.seed=(old.seed||0)+1;for(let day=0;day<7;day++)for(const [slot] of SLOTS){if(old.days[day][slot].locked){fresh.days[day][slot]={...old.days[day][slot]};continue;}fresh.days[day][slot].recipeId=demoPick(slot,day,Math.abs(fresh.seed)%91);}state.menus[mealKey()]=fresh;save();state.view='week';render();notify('Nueva combinación de platos de ejemplo. No constituye un menú nutricional validado.');}
function saveProfile(form){const data=new FormData(form);const name=String(data.get('name')||'').trim();const years=Number(data.get('ageYears'));const months=Number(data.get('ageMonths')||0);if(!name||!Number.isInteger(years)||years<1||years>16||!Number.isInteger(months)||months<0||months>11||(years===16&&months>0)){errorForm('profile-error','Indica un nombre y una edad válida entre 1 y 16 años.');return;}const weight=String(data.get('weight')||''),height=String(data.get('height')||'');if((weight&&(!Number.isFinite(+weight)||+weight<=0))||(height&&(!Number.isFinite(+height)||+height<=0))){errorForm('profile-error','Revisa el peso y la estatura.');return;}const previous=state.profiles.find(p=>p.id===editingProfileId);const p={id:previous?.id||id(),name,ageYears:years,ageMonths:months,weight,height,restrictions:data.getAll('restriction'),excluded:String(data.get('excluded')||'').trim(),school:data.has('school'),demo:false};if(previous){state.profiles=state.profiles.map(x=>x.id===p.id?p:x);}else state.profiles.push(p);state.activeProfile=p.id;editingProfileId=p.id;save();render();notify('Perfil guardado solo en este dispositivo.');}
function errorForm(id,text){const node=document.getElementById(id);if(node){node.textContent=text;node.hidden=false;}}
function saveRecipe(form){const d=new FormData(form);const name=String(d.get('name')||'').trim();if(!name){errorForm('recipe-error','Introduce el nombre del plato.');return;}const lines=String(d.get('ingredients')||'').split('\n').map(s=>s.trim()).filter(Boolean);const ingredients=[];for(const line of lines){const parts=line.split('|').map(s=>s.trim());const [ingredient,quantity='',unit='g']=parts;if(!ingredient){errorForm('recipe-error','Cada ingrediente debe tener un nombre.');return;}if(!['g','ml','ud'].includes(unit)){errorForm('recipe-error','Las unidades permitidas son g, ml o ud.');return;}let qty=null;if(quantity){const clean=quantity.replace(',','.');qty=Number(clean);if(!Number.isFinite(qty)||qty<=0||qty>100000){errorForm('recipe-error','Las cantidades deben ser números positivos razonables.');return;}}if(ingredients.length>=45){errorForm('recipe-error','Máximo 45 ingredientes por plato.');return;}ingredients.push(ing(ingredient,groupForIngredient(ingredient),qty,unit));}if(!ingredients.length){errorForm('recipe-error','Introduce al menos un ingrediente.');return;}const rid=id();state.customRecipes[rid]={id:rid,name,slot:form.dataset.slot,group:String(d.get('group')||'proteinas'),ingredients,allergens:[],manual:true,allergensReviewed:false};const meal=menu().days[Number(form.dataset.day)][form.dataset.slot];meal.recipeId=rid;meal.external=false;save();state.modal=null;render();notify('Plato personalizado guardado. Las cantidades son las que has introducido.');}
function groupForIngredient(name){const n=name.toLowerCase();if(/tomate|zanahoria|calabaza|calabacín|pimiento|judías verdes|brócoli|lechuga|cebolla/.test(n))return'verduras';if(/manzana|plátano|pera|mandarina|fruta|aguacate/.test(n))return'fruta';if(/arroz|pasta|pan|avena|patata|boniato/.test(n))return'cereales';if(/garbanzo|lenteja|alubia/.test(n))return'legumbres';if(/leche|queso|yogur/.test(n))return'lacteos';return'proteinas';}
function printDocument(kind){const p=profile();const warning='PROTOTIPO: platos ilustrativos no validados; no utilizar como pauta alimentaria. Las cantidades no han sido definidas por fuentes pediátricas.';let body='';if(kind==='menu')body=`<table><thead><tr><th>Ingesta</th>${DAYS.map((d,i)=>`<th>${d}<br>${parseDate(addDays(state.week,i)).getDate()}</th>`).join('')}</tr></thead><tbody>${activeMeals().map(([slot,label])=>`<tr><th>${label}</th>${DAYS.map((d,i)=>{const {m,recipe:r}=mealData(i,slot);return `<td><b>${h(m.external?'Comedor / fuera':r?.name||'Sin definir')}</b>${m.external?'':`<div style="font-size:7pt;margin-top:5pt">${h((r?.ingredients||[]).map(x=>x.name+(Number.isFinite(x.qty)&&x.qty>0?' '+fmtNum(x.qty)+' '+x.unit:'')).join(', '))}</div>`}</td>`;}).join('')}</tr>`).join('')}</tbody></table>`;else {const d=shoppingData(),g=new Map();for(const item of d.items){let k=GROUPS.find(x=>x[0]===item.group)?.[1]||'Otros';if(!g.has(k))g.set(k,[]);g.get(k).push(item);}body=`<div class="print-shopping">${[...g.entries()].map(([title,items])=>`<div class="print-shop-section"><h3>${h(title)}</h3>${items.map(x=>`<p>□ ${h(x.name)} — ${h(shoppingAmount(x))}</p>`).join('')}</div>`).join('')}</div>`;}
const target=document.getElementById('print-sheet');target.innerHTML=`<h1>${kind==='menu'?'Menú semanal':'Lista de la compra'}</h1><div class="print-meta">Perfil: ${h(p.name)} · Semana ${h(weekLabel())} · Versión de demostración V0.2</div>${body}<p class="print-warning">${h(warning)}</p>`;try{window.print();}catch{notify('Utiliza la opción Imprimir / Guardar como PDF del navegador.');}}
// Eventos delegados: no se transmiten datos por red.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='scrim'&&e.target!==el)return;if(['purchase','select-profile-input','slot-toggle','dark-mode','lock-meal','external-meal'].includes(action))return;
if(action==='nav'){state.view=el.dataset.view;state.modal=null;render();window.scrollTo({top:0,behavior:'instant'});return;}
if(action==='prev-week'||action==='next-week'){state.week=addDays(state.week,action==='prev-week'?-7:7);state.selectedDay=0;save();render();return;}
if(action==='day'){state.selectedDay=Number(el.dataset.day);save();render();return;}
if(action==='meal'){editingMealTab='suggestions';openModal('meal',{day:Number(el.dataset.day),slot:el.dataset.slot});return;}
if(action==='modal-tab'){editingMealTab=el.dataset.tab;render();return;}
if(action==='choose-recipe'){if((profile().restrictions||[]).length||String(profile().excluded||'').trim()){notify('Sustitución automática bloqueada por restricciones sin validar.');return;}const modal=state.modal;updateMenu(modal.day,modal.slot,m=>{m.recipeId=el.dataset.recipe;m.external=false;});state.modal=null;render();return;}
if(action==='close-modal'||action==='scrim'){closeModal();return;}
if(action==='new-profile'){editingProfileId='new';render();return;}
if(action==='edit-profile'){editingProfileId=el.dataset.id;render();return;}
if(action==='select-profile'){state.activeProfile=el.dataset.id;editingProfileId=el.dataset.id;save();render();return;}
if(action==='delete-profile'){if(state.profiles.length<2){notify('Necesitas conservar al menos un perfil.');return;}if(!confirm('¿Eliminar este perfil y sus menús locales? Esta acción no se puede deshacer.'))return;const pid=editingProfileId;state.profiles=state.profiles.filter(x=>x.id!==pid);for(const k of Object.keys(state.menus))if(k.startsWith(pid+'|'))delete state.menus[k];state.activeProfile=state.profiles[0].id;editingProfileId=state.activeProfile;save();render();return;}
if(action==='generate-demo'){generateDemo();return;}
if(action==='blank-week'){if(!confirm('¿Crear una semana en blanco? Sustituirá esta semana pero conservará los platos que hayas fijado.'))return;const old=menu();const blank={days:DAYS.map((_,di)=>Object.fromEntries(SLOTS.map(([slot])=>[slot,old.days[di][slot].locked?{...old.days[di][slot]}:{recipeId:null,locked:false,external:false}]))),seed:0,kind:'manual',createdAt:new Date().toISOString()};state.menus[mealKey()]=blank;state.view='week';save();render();notify('Semana en blanco preparada. Toca cualquier toma para crear un plato.');return;}
if(action==='print-menu'||action==='print-shopping'){printDocument(action==='print-menu'?'menu':'shopping');return;}
if(action==='uncheck-all'){for(const item of shoppingData().items)delete state.purchased[purchaseKey(item)];save();render();return;}
if(action==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();return;}
if(action==='reset-demo'){if(!confirm('¿Borrar todos los perfiles, menús y ajustes de este dispositivo?'))return;localStorage.removeItem(STORAGE_KEY);state=defaultState();editingProfileId=null;save();render();notify('Demostración restablecida.');return;}
});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[name="restriction"]')){el.closest('label')?.classList.toggle('selected',el.checked);return;}const action=el.dataset.action;if(action==='select-profile-input'){state.activeProfile=el.value;editingProfileId=el.value;save();render();return;}if(action==='purchase'){const key=mealKey()+'|'+el.dataset.item.toLocaleLowerCase('es');state.purchased[key]=el.checked;save();render();return;}if(action==='dark-mode'){state.settings.theme=el.checked?'dark':'light';save();render();return;}if(action==='slot-toggle'){const yes=Object.values(state.settings.meals).filter(Boolean).length;if(!el.checked&&yes<=1){notify('Debe quedar al menos una toma activa.');render();return;}state.settings.meals[el.dataset.slot]=el.checked;save();render();return;}if(action==='lock-meal'||action==='external-meal'){const mm=state.modal;if(!mm)return;updateMenu(mm.day,mm.slot,m=>{m[action==='lock-meal'?'locked':'external']=el.checked;});return;}});
document.addEventListener('submit',e=>{if(e.target?.id==='profile-form'){e.preventDefault();saveProfile(e.target);}if(e.target?.id==='recipe-form'){e.preventDefault();saveRecipe(e.target);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();});
render();

</script>
  
</body>
